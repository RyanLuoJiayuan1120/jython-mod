# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.11
loader_version=0.18.4
loom_version=1.15-SNAPSHOT

# Mod Properties
mod_version=release-0.0.1
maven_group=net.luojiayuan.jython.mod
archives_base_name=jython-mod

# Dependencies
fabric_api_version=0.141.3+1.21.11
jython_version=2.7.3

# HTTP Proxy
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.http.nonProxyHosts=localhost|127.*|[::1]

# HTTPS Proxy
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
systemProp.https.nonProxyHosts=localhost|127.*|[::1]

# SOCKS Proxy (if needed)
systemProp.socks.proxyHost=127.0.0.1
systemProp.socks.proxyPort=7897
systemProp.socks.nonProxyHosts=localhost|127.*|[::1]