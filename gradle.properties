# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.11
loader_version=0.18.4
loom_version=1.15-SNAPSHOT

# Mod Properties
mod_version=v1.1.2-rel
# NeoForge requires the in-jar version to start with a digit (Fabric accepts the
# user-facing "v..." prefix, so the two loaders use different values).
neoforge_mod_version=1.1.2-rel
maven_group=net.luojiayuan.jython.mod
archives_base_name=jython-mod

# NeoForge Properties
# check these on https://maven.neoforged.net/releases/net/neoforged/neoforge/
neoforge_version=21.11.44
# FancyModLoader version matching the NeoForge version above
# (see the neoforge POM: net.neoforged.fancymodloader:loader)
fml_loader_version=10.0.36

# Paper Properties
# check these on https://fill.papermc.io/
paper_api_version=1.21.11-R0.1-SNAPSHOT

# Dependencies
fabric_api_version=0.141.3+1.21.11
