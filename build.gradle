plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
	id "org.graalvm.python" version "24.2.0"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	// Maven Central for Jython
	mavenCentral()

	// Cloth Config
	maven { url = 'https://maven.shedaniel.me/' }
	// Mod Menu
	maven { url = 'https://maven.terraformersmc.com/' }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"jython-mod" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	// 配置包含库
	runs {
		client {
			vmArg "-Djava.library.path=${file('lib')}"
		}
	}
}

// 声明 include 配置用于打包依赖
configurations {
	includeImplementation
	include
	includeImplementation.extendsFrom(include)
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	
	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Jython - Python implementation for Java (打包进jar)
	implementation "org.python:jython-standalone:${project.jython_version}"
	includeImplementation "org.python:jython-standalone:${project.jython_version}"
	implementation("net.fabricmc.fabric-loom-remap:net.fabricmc.fabric-loom-remap.gradle.plugin:1.14.7")
	implementation "net.fabricmc:mapping-io:0.3.0"
	// Cloth Config - Configuration library with GUI
	modApi "me.shedaniel.cloth:cloth-config-fabric:21.11.153"
    implementation("org.graalvm.polyglot:polyglot:24.2.0")
    implementation("org.graalvm.polyglot:python:24.2.0")
	// Mod Menu - For in-game mod configuration UI
	// modImplementation "com.terraformersmc:modmenu:17.0.0-beta.2"

}

// processResources {
// 	inputs.property "version", project.version

// 	filesMatching("fabric.mod.json") {
// 		expand "version": inputs.properties.version
// 	}
// }

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// 在 afterEvaluate 中配置 jar 任务来包含 Jython
afterEvaluate {
	tasks.named('jar').configure {
		// 完整包含 Jython Standalone JAR 的所有内容
		from(configurations.includeImplementation.collect { it.isDirectory() ? it : zipTree(it) }) {
			// 包含所有必需的文件，不过滤
			exclude "META-INF/*.RSA"
			exclude "META-INF/*.SF"
			exclude "META-INF/LICENSE"
			exclude "META-INF/NOTICE"
		}

		// 确保 Jython 能找到 lib 目录
		manifest {
			attributes(
				"Jython-Python-Home": "/python"
			)
		}
	}
}

// configure the maven publication
// 排除 POM 文件避免 Fabric Loader 扫描时报 zip 错误
tasks.withType(JavaExec).configureEach {
    if (name == 'runClient' || name == 'runServer') {
        classpath = classpath.filter { !it.name.endsWith('.pom') }
    }
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

