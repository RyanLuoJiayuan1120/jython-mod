import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
	id "org.graalvm.python" version "24.2.0"
	id 'com.gradleup.shadow' version '9.6.1'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	mavenCentral()

	// Cloth Config
	maven { url = 'https://maven.shedaniel.me/' }
	// Mod Menu
	maven { url = 'https://maven.terraformersmc.com/' }
	// NeoForge
	maven { url = 'https://maven.neoforged.net/releases/' }
	// PaperMC
	maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

sourceSets {
	main {
		java {
			srcDirs = ['common/main/java', 'fabric/main/java']
		}
		resources {
			srcDirs = ['common/main/resources', 'fabric/main/resources']
		}
	}
	// NeoForge skeleton: compiled against the universal NeoForge jar plus the
	// shared common source set. It must not reuse Fabric's compiled output.
	neoforge {
		java.srcDirs = ['common/main/java', 'neoforge/main/java']
		resources.srcDirs = ['common/main/resources', 'neoforge/main/resources']
		compileClasspath += sourceSets.main.compileClasspath.filter {
			!it.name.contains('cloth-config-fabric')
		}
	}
	// Paper skeleton: compiled against the Paper API plus the main source set,
	// not packaged by Loom either. The shared Python runtime resources
	// (zipimporter.py, mappings) are included so Loader can find them.
	paper {
		java.srcDirs = ['paper/main/java']
		resources.srcDirs = ['paper/main/resources', 'common/main/resources']
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
	}

	// ------------------------------------------------------------------
	// Example third-party mod (examples/api-demo-mod): demonstrates how a
	// foreign Java mod registers APIs via JythonModApi. Three platform
	// variants share the common demo classes; each compiles against the
	// main output (for JythonModApi) plus its own platform API.
	// ------------------------------------------------------------------
	demoFabric {
		java.srcDirs = ['examples/api-demo-mod/common/main/java', 'examples/api-demo-mod/fabric/main/java']
		resources.srcDirs = ['examples/api-demo-mod/fabric/main/resources']
		compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
	}
	demoNeoForge {
		java.srcDirs = ['examples/api-demo-mod/common/main/java', 'examples/api-demo-mod/neoforge/main/java']
		resources.srcDirs = ['examples/api-demo-mod/neoforge/main/resources']
		compileClasspath += sourceSets.main.output + sourceSets.neoforge.compileClasspath
	}
	demoPaper {
		java.srcDirs = ['examples/api-demo-mod/common/main/java', 'examples/api-demo-mod/paper/main/java']
		resources.srcDirs = ['examples/api-demo-mod/paper/main/resources']
		compileClasspath += sourceSets.main.output + sourceSets.paper.compileClasspath
	}
}

// GraalPy runtime bundled into the Paper/NeoForge fat jars (resolved by Shadow).
configurations {
	paperRuntime {
		canBeConsumed = false
		canBeResolved = true
	}
	neoforgeRuntime {
		canBeConsumed = false
		canBeResolved = true
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"jython-mod" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			vmArg "-Djava.library.path=${file('lib')}"
		}
	}
}

sourceSets.client.java.srcDirs = ['common/client/java', 'fabric/client/java']
sourceSets.client.resources.srcDirs = ['common/client/resources', 'fabric/client/resources']

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	
	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// JUnit 5 for the JythonModApi registry + GraalPy wrapper tests.
	testImplementation platform('org.junit:junit-bom:5.10.2')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	implementation("net.fabricmc.fabric-loom-remap:net.fabricmc.fabric-loom-remap.gradle.plugin:1.14.7")
	implementation "net.fabricmc:mapping-io:0.3.0"
	// Fabric production jar bundles the mapping-io library used by common code.
	include "net.fabricmc:mapping-io:0.3.0"
	// Cloth Config - Configuration library with GUI
	modApi "me.shedaniel.cloth:cloth-config-fabric:21.11.153"
    implementation("org.graalvm.polyglot:polyglot:25.1.3")
    implementation("org.graalvm.polyglot:python:25.1.3")
	// Fabric production jar must also bundle the GraalPy runtime. The dev run
	// gets these from the run classpath, but a production install only ships
	// what is inside the mod jar — mirror the NeoForge/Paper fat jars here.
	// Loom's `include` does not pull transitive deps, so every GraalPy runtime
	// jar must be listed explicitly.
	include "org.graalvm.polyglot:polyglot:25.1.3"
	include "org.graalvm.python:python-language:25.1.3"
	include "org.graalvm.python:python-resources:25.1.3"
	include "org.graalvm.truffle:truffle-runtime:25.1.3"
	include "org.graalvm.truffle:truffle-api:25.1.3"
	include "org.graalvm.truffle:truffle-compiler:25.1.3"
	include "org.graalvm.sdk:collections:25.1.3"
	include "org.graalvm.sdk:nativeimage:25.1.3"
	include "org.graalvm.sdk:word:25.1.3"
	include "org.graalvm.sdk:jniutils:25.1.3"
	include "org.graalvm.regex:regex:25.1.3"
	include "org.graalvm.tools:profiler-tool:25.1.3"
	include "org.graalvm.shadowed:icu4j:25.1.3"
	include "org.graalvm.shadowed:json:25.1.3"
	include "org.graalvm.shadowed:xz:25.1.3"
	// Mod Menu - For in-game mod configuration UI
	// modImplementation "com.terraformersmc:modmenu:17.0.0-beta.2"

	// NeoForge skeleton (compile-only, universal jar)
	neoforgeCompileOnly "net.neoforged:neoforge:${project.neoforge_version}:universal"
	neoforgeCompileOnly "net.neoforged.fancymodloader:loader:${project.fml_loader_version}"
	// Cloth Config - Configuration library (NeoForge)
	neoforgeCompileOnly "me.shedaniel.cloth:cloth-config-neoforge:21.11.152"

	// Paper skeleton (compile-only API)
	paperCompileOnly "io.papermc.paper:paper-api:${project.paper_api_version}"

	// Paper fat-jar runtime (bundled into the Paper plugin jar via Shadow)
	paperRuntime "org.graalvm.polyglot:polyglot:25.1.3"
	paperRuntime "org.graalvm.python:python-language:25.1.3"
	paperRuntime "org.graalvm.python:python-resources:25.1.3"
	paperRuntime "org.graalvm.truffle:truffle-runtime:25.1.3"
	paperRuntime("net.fabricmc:mapping-io:0.3.0") { transitive = false }
	// Cloth Config is not a server dependency on Paper, but ModConfig implements
	// its ConfigData interface (AutoConfig requirement on Fabric/NeoForge), so the
	// Paper fat jar bundles it to let ModConfig load. The AutoConfig path itself is
	// never taken on Paper (supportsConfigGui() == false); only the interface and
	// annotation classes are needed at class-load time.
	paperRuntime("me.shedaniel.cloth:cloth-config-fabric:21.11.153") { transitive = false }

	// NeoForge fat-jar runtime (bundled into the NeoForge mod jar via Shadow)
	neoforgeRuntime "org.graalvm.polyglot:polyglot:25.1.3"
	neoforgeRuntime "org.graalvm.python:python-language:25.1.3"
	neoforgeRuntime "org.graalvm.python:python-resources:25.1.3"
	neoforgeRuntime "org.graalvm.truffle:truffle-runtime:25.1.3"
	neoforgeRuntime("net.fabricmc:mapping-io:0.3.0") { transitive = false }

}

// Inject the mod version into each loader's metadata file.
processResources {
	inputs.property "version", project.mod_version
	filesMatching("fabric.mod.json") {
		expand "version": project.mod_version
	}
}

processNeoforgeResources {
	inputs.property "version", project.neoforge_mod_version
	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": project.neoforge_mod_version
	}
}

processPaperResources {
	inputs.property "version", project.mod_version
	filesMatching("paper-plugin.yml") {
		expand "version": project.mod_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat "full"
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// Shadow's stock shadowJar would try to fatten the Fabric jar; we only want a Paper fat jar.
tasks.named('shadowJar') {
	enabled = false
}

tasks.register('paperJar', ShadowJar) {
	group = 'build'
	description = 'Builds a self-contained Paper plugin jar (Paper classes + GraalPy runtime).'
	archiveBaseName = project.base.archivesName
	archiveClassifier = 'paper'
	archiveVersion = project.version

	// Bundle the shared common classes (mod runtime, loaders, mapping) plus the
	// Paper entrypoint, and the GraalPy runtime. The common code is compiled
	// into sourceSets.main.output (which also carries the Fabric classes, but
	// those are only referenced from Fabric-specific entrypoints and are never
	// loaded on Paper).
	from(sourceSets.main.output)
	from(sourceSets.paper.output)
	configurations = [project.configurations.paperRuntime]

	mergeServiceFiles()
	// Keep duplicates flowing into the service-file transformer; drop only
	// signature files and module descriptors that would otherwise be duplicated.
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
	exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
	exclude '*.pom'
	exclude 'module-info.class'
	exclude 'META-INF/versions/*/module-info.class'
	manifest {
		attributes 'Multi-Release': 'true'
	}
}

tasks.register('neoforgeJar', ShadowJar) {
	group = 'build'
	description = 'Builds a self-contained NeoForge mod jar (NeoForge classes + GraalPy runtime).'
	archiveBaseName = project.base.archivesName
	archiveClassifier = 'neoforge'
	archiveVersion = project.version

	from(sourceSets.neoforge.output)
	configurations = [project.configurations.neoforgeRuntime]

	mergeServiceFiles()
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
	exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
	exclude '*.pom'
	exclude 'module-info.class'
	exclude 'META-INF/versions/*/module-info.class'
	manifest {
		attributes 'Multi-Release': 'true'
	}
}

tasks.named('assemble') {
	dependsOn tasks.named('paperJar')
	dependsOn tasks.named('neoforgeJar')
}

// ------------------------------------------------------------------
// Example third-party mod jars (for smoke tests of JythonModApi).
// ------------------------------------------------------------------
tasks.register('demoFabricJar', Jar) {
	group = 'build'
	description = 'Builds the example API demo mod (Fabric).'
	archiveBaseName = project.base.archivesName
	archiveClassifier = 'demo-fabric'
	archiveVersion = project.version
	from(sourceSets.demoFabric.output)
}

tasks.register('demoNeoForgeJar', Jar) {
	group = 'build'
	description = 'Builds the example API demo mod (NeoForge).'
	archiveBaseName = project.base.archivesName
	archiveClassifier = 'demo-neoforge'
	archiveVersion = project.version
	from(sourceSets.demoNeoForge.output)
}

tasks.register('demoPaperJar', Jar) {
	group = 'build'
	description = 'Builds the example API demo mod (Paper).'
	archiveBaseName = project.base.archivesName
	archiveClassifier = 'demo-paper'
	archiveVersion = project.version
	from(sourceSets.demoPaper.output)
}

// Python side of the demo: zips examples/api-demo-python into a jymods module.
tasks.register('demoPythonZip', Zip) {
	group = 'build'
	description = 'Builds the Python demo module zip for JythonModApi smoke tests.'
	archiveBaseName = 'api-demo-python'
	archiveVersion = ''
	destinationDirectory = layout.buildDirectory.dir('libs')
	from('examples/api-demo-python') {
		include 'main.py'
	}
	rename { 'main.py' }
}

tasks.register('demoJars') {
	group = 'build'
	description = 'Builds all example demo artifacts (Fabric/NeoForge/Paper jars + Python zip).'
	dependsOn tasks.named('demoFabricJar')
	dependsOn tasks.named('demoNeoForgeJar')
	dependsOn tasks.named('demoPaperJar')
	dependsOn tasks.named('demoPythonZip')
}

tasks.named('assemble') {
	dependsOn tasks.named('demoJars')
}

// configure the maven publication
// 排除 POM 文件避免 Fabric Loader 扫描时报 zip 错误
tasks.withType(JavaExec).configureEach {
    if (name == 'runClient' || name == 'runServer') {
        classpath = classpath.filter { !it.name.endsWith('.pom') }
    }
}

// API-only jar：只编译 api 包源码（依赖为空的纯 Java 构件）。
// 需在 publishing 块之前注册，publication 里以 tasks.named('apiJar') 引用。
tasks.register('apiJar', Jar) {
	group = 'build'
	description = 'Builds the API-only jar (net.luojiayuan.jython.mod.api, no Minecraft/GraalPy).'
	archiveBaseName = 'jython-mod-api'
	archiveVersion = project.mod_version
	// 直接打包 api 包的 .class（编译产物由 compileJava 提供，源码与主工程同源）
	from(sourceSets.main.output) {
		include 'net/luojiayuan/jython/mod/api/**'
	}
	manifest {
		attributes(
			'Implementation-Title': 'jython-mod-api',
			'Implementation-Version': project.mod_version
		)
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}

		// API-only 构件：只包含 net.luojiayuan.jython.mod.api 包（纯 JDK，
		// 无 Minecraft / GraalPy 依赖）。供其它 Java 模组 compileOnly 依赖，
		// 用于 JythonModApi.register(...) 注册。完整 fat jar 走 Releases。
		create("mavenApi", MavenPublication) {
			groupId = project.maven_group
			artifactId = 'jython-mod-api'
			version = project.mod_version
			artifact tasks.named('apiJar')
			pom {
				name = 'jython-mod-api'
				description = 'Jython Mod public API - register APIs callable from Python'
				url = 'https://github.com/RyanLuoJiayuan1120/jython-mod'
				licenses {
					license {
						name = 'MIT'
						url = 'https://opensource.org/licenses/MIT'
					}
				}
			}
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.

		// GitHub Pages 静态 maven 仓库：CI 把 publishMavenApiPublicationToGitHubPagesRepository
		// 的输出推到 gh-pages 分支即可。坐标：
		//   https://<user>.github.io/<repo>/net/luojiayuan/jython/mod/jython-mod-api/<version>/
		maven {
			name = 'githubPages'
			url = layout.buildDirectory.dir('maven-repo')
		}
	}
}
