import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
	id "org.graalvm.python" version "24.2.0"
	id 'com.gradleup.shadow' version '9.6.1'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	mavenCentral()

	// Cloth Config
	maven { url = 'https://maven.shedaniel.me/' }
	// Mod Menu
	maven { url = 'https://maven.terraformersmc.com/' }
	// NeoForge
	maven { url = 'https://maven.neoforged.net/releases/' }
	// PaperMC
	maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

sourceSets {
	main {
		java {
			srcDirs = ['common/main/java', 'fabric/main/java']
		}
		resources {
			srcDirs = ['common/main/resources', 'fabric/main/resources']
		}
	}
	// NeoForge skeleton: compiled against the universal NeoForge jar plus the
	// shared common source set. It must not reuse Fabric's compiled output.
	neoforge {
		java.srcDirs = ['common/main/java', 'neoforge/main/java']
		resources.srcDirs = ['common/main/resources', 'neoforge/main/resources']
		compileClasspath += sourceSets.main.compileClasspath.filter {
			!it.name.contains('cloth-config-fabric')
		}
	}
	// Paper skeleton: compiled against the Paper API plus the main source set,
	// not packaged by Loom either.
	paper {
		java.srcDirs = ['paper/main/java']
		resources.srcDirs = ['paper/main/resources']
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
	}
}

// GraalPy runtime bundled into the Paper/NeoForge fat jars (resolved by Shadow).
configurations {
	paperRuntime {
		canBeConsumed = false
		canBeResolved = true
	}
	neoforgeRuntime {
		canBeConsumed = false
		canBeResolved = true
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"jython-mod" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			vmArg "-Djava.library.path=${file('lib')}"
		}
	}
}

sourceSets.client.java.srcDirs = ['common/client/java', 'fabric/client/java']
sourceSets.client.resources.srcDirs = ['common/client/resources', 'fabric/client/resources']

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	
	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation("net.fabricmc.fabric-loom-remap:net.fabricmc.fabric-loom-remap.gradle.plugin:1.14.7")
	implementation "net.fabricmc:mapping-io:0.3.0"
	// Fabric production jar bundles the mapping-io library used by common code.
	include "net.fabricmc:mapping-io:0.3.0"
	// Cloth Config - Configuration library with GUI
	modApi "me.shedaniel.cloth:cloth-config-fabric:21.11.153"
    implementation("org.graalvm.polyglot:polyglot:25.1.3")
    implementation("org.graalvm.polyglot:python:25.1.3")
	// Mod Menu - For in-game mod configuration UI
	// modImplementation "com.terraformersmc:modmenu:17.0.0-beta.2"

	// NeoForge skeleton (compile-only, universal jar)
	neoforgeCompileOnly "net.neoforged:neoforge:${project.neoforge_version}:universal"
	neoforgeCompileOnly "net.neoforged.fancymodloader:loader:${project.fml_loader_version}"
	// Cloth Config - Configuration library (NeoForge)
	neoforgeCompileOnly "me.shedaniel.cloth:cloth-config-neoforge:21.11.152"

	// Paper skeleton (compile-only API)
	paperCompileOnly "io.papermc.paper:paper-api:${project.paper_api_version}"

	// Paper fat-jar runtime (bundled into the Paper plugin jar via Shadow)
	paperRuntime "org.graalvm.polyglot:polyglot:25.1.3"
	paperRuntime "org.graalvm.python:python-language:25.1.3"
	paperRuntime "org.graalvm.python:python-resources:25.1.3"
	paperRuntime "org.graalvm.truffle:truffle-runtime:25.1.3"
	paperRuntime("net.fabricmc:mapping-io:0.3.0") { transitive = false }

	// NeoForge fat-jar runtime (bundled into the NeoForge mod jar via Shadow)
	neoforgeRuntime "org.graalvm.polyglot:polyglot:25.1.3"
	neoforgeRuntime "org.graalvm.python:python-language:25.1.3"
	neoforgeRuntime "org.graalvm.python:python-resources:25.1.3"
	neoforgeRuntime "org.graalvm.truffle:truffle-runtime:25.1.3"
	neoforgeRuntime("net.fabricmc:mapping-io:0.3.0") { transitive = false }

}

// Inject the mod version into each loader's metadata file.
processResources {
	inputs.property "version", project.mod_version
	filesMatching("fabric.mod.json") {
		expand "version": project.mod_version
	}
}

processNeoforgeResources {
	inputs.property "version", project.neoforge_mod_version
	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": project.neoforge_mod_version
	}
}

processPaperResources {
	inputs.property "version", project.mod_version
	filesMatching("paper-plugin.yml") {
		expand "version": project.mod_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// Shadow's stock shadowJar would try to fatten the Fabric jar; we only want a Paper fat jar.
tasks.named('shadowJar') {
	enabled = false
}

tasks.register('paperJar', ShadowJar) {
	group = 'build'
	description = 'Builds a self-contained Paper plugin jar (Paper classes + GraalPy runtime).'
	archiveBaseName = project.base.archivesName
	archiveClassifier = 'paper'
	archiveVersion = project.version

	from(sourceSets.paper.output)
	configurations = [project.configurations.paperRuntime]

	mergeServiceFiles()
	// Keep duplicates flowing into the service-file transformer; drop only
	// signature files and module descriptors that would otherwise be duplicated.
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
	exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
	exclude '*.pom'
	exclude 'module-info.class'
	exclude 'META-INF/versions/*/module-info.class'
	manifest {
		attributes 'Multi-Release': 'true'
	}
}

tasks.register('neoforgeJar', ShadowJar) {
	group = 'build'
	description = 'Builds a self-contained NeoForge mod jar (NeoForge classes + GraalPy runtime).'
	archiveBaseName = project.base.archivesName
	archiveClassifier = 'neoforge'
	archiveVersion = project.version

	from(sourceSets.neoforge.output)
	configurations = [project.configurations.neoforgeRuntime]

	mergeServiceFiles()
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
	exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
	exclude '*.pom'
	exclude 'module-info.class'
	exclude 'META-INF/versions/*/module-info.class'
	manifest {
		attributes 'Multi-Release': 'true'
	}
}

tasks.named('assemble') {
	dependsOn tasks.named('paperJar')
	dependsOn tasks.named('neoforgeJar')
}

// configure the maven publication
// 排除 POM 文件避免 Fabric Loader 扫描时报 zip 错误
tasks.withType(JavaExec).configureEach {
    if (name == 'runClient' || name == 'runServer') {
        classpath = classpath.filter { !it.name.endsWith('.pom') }
    }
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
